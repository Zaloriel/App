<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #3498db;
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
        }

        .section h2::before {
            content: '';
            width: 25px;
            height: 25px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 50%;
            margin-right: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .response {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .response.success {
            background: linear-gradient(135deg, #d5f4e6, #c3e9d0);
            border: 2px solid #27ae60;
            color: #155724;
        }

        .response.error {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            border: 2px solid #e74c3c;
            color: #721c24;
        }

        .users-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .user-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #dee2e6;
            transition: all 0.3s ease;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-color: #3498db;
        }

        .user-card h4 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .user-card p {
            margin: 5px 0;
            color: #555;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .server-config {
            background: linear-gradient(135deg, #fff3cd, #ffeaa7);
            border: 2px solid #f39c12;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .server-config h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }

            .content {
                padding: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔧 Управление пользователями</h1>
        <p>REST API интерфейс для Spring приложения</p>
    </div>

    <div class="content">
        <div class="server-config">
            <h3>⚙️ Настройки сервера</h3>
            <div class="form-group">
                <label for="serverUrl">URL сервера:</label>
                <input type="text" id="serverUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
            </div>
        </div>

        <!-- Создание пользователя -->
        <div class="section">
            <h2>➕ Создать пользователя</h2>
            <form id="createUserForm">
                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="createName">Имя:</label>
                        <input type="text" id="createName" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="createEmail">Email:</label>
                        <input type="email" id="createEmail" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Создать пользователя</button>
            </form>
            <div id="createResponse" class="response" style="display: none;"></div>
        </div>

        <!-- Получить всех пользователей -->
        <div class="section">
            <h2>👥 Получить всех пользователей</h2>
            <button id="getAllUsersBtn" class="btn btn-primary">Загрузить всех пользователей</button>
            <div id="getAllResponse" class="response" style="display: none;"></div>
            <div id="usersGrid" class="users-grid"></div>
        </div>

        <!-- Получить пользователя по ID -->
        <div class="section">
            <h2>🔍 Получить пользователя по ID</h2>
            <div class="form-group">
                <label for="getUserId">ID пользователя:</label>
                <input type="number" id="getUserId" placeholder="Введите ID">
            </div>
            <button id="getUserByIdBtn" class="btn btn-info">Найти пользователя</button>
            <div id="getUserByIdResponse" class="response" style="display: none;"></div>
        </div>

        <!-- Получить пользователя по Email -->
        <div class="section">
            <h2>📧 Получить пользователя по Email</h2>
            <div class="form-group">
                <label for="getUserEmail">Email пользователя:</label>
                <input type="email" id="getUserEmail" placeholder="Введите email">
            </div>
            <button id="getUserByEmailBtn" class="btn btn-info">Найти пользователя</button>
            <div id="getUserByEmailResponse" class="response" style="display: none;"></div>
        </div>

        <!-- Обновить пользователя -->
        <div class="section">
            <h2>✏️ Обновить пользователя</h2>
            <form id="updateUserForm">
                <div class="form-row">
                    <div class="form-group" style="flex: 0 0 150px;">
                        <label for="updateId">ID:</label>
                        <input type="number" id="updateId" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="updateName">Новое имя:</label>
                        <input type="text" id="updateName">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="updateEmail">Новый email:</label>
                        <input type="email" id="updateEmail">
                    </div>
                </div>
                <button type="submit" class="btn btn-warning">Обновить пользователя</button>
            </form>
            <div id="updateResponse" class="response" style="display: none;"></div>
        </div>

        <!-- Удалить пользователя -->
        <div class="section">
            <h2>🗑️ Удалить пользователя</h2>
            <div class="form-group">
                <label for="deleteId">ID пользователя для удаления:</label>
                <input type="number" id="deleteId" placeholder="Введите ID">
            </div>
            <button id="deleteUserBtn" class="btn btn-danger">Удалить пользователя</button>
            <div id="deleteResponse" class="response" style="display: none;"></div>
        </div>
    </div>
</div>

<script>
    // Получение URL сервера
    function getServerUrl() {
        return document.getElementById('serverUrl').value || 'http://localhost:8080';
    }

    // Показать ответ
    function showResponse(elementId, data, isError = false) {
        const element = document.getElementById(elementId);
        element.style.display = 'block';
        element.className = `response ${isError ? 'error' : 'success'}`;
        element.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
    }

    // Показать загрузку
    function showLoading(buttonId) {
        const button = document.getElementById(buttonId);
        const originalText = button.textContent;
        button.innerHTML = originalText + '<span class="loading"></span>';
        button.disabled = true;
        return originalText;
    }

    // Скрыть загрузку
    function hideLoading(buttonId, originalText) {
        const button = document.getElementById(buttonId);
        button.textContent = originalText;
        button.disabled = false;
    }

    // Создать пользователя
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const originalText = showLoading('createUserForm');

        const data = {
            name: document.getElementById('createName').value,
            email: document.getElementById('createEmail').value
        };

        try {
            const response = await fetch(`${getServerUrl()}/api/users`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                showResponse('createResponse', result);
                document.getElementById('createUserForm').reset();
            } else {
                showResponse('createResponse', result, true);
            }
        } catch (error) {
            showResponse('createResponse', `Ошибка: ${error.message}`, true);
        }

        hideLoading('createUserForm', originalText);
    });

    // Получить всех пользователей
    document.getElementById('getAllUsersBtn').addEventListener('click', async () => {
        const originalText = showLoading('getAllUsersBtn');

        try {
            const response = await fetch(`${getServerUrl()}/api/users`);
            const result = await response.json();

            if (response.ok) {
                showResponse('getAllResponse', result);
                displayUsersGrid(result);
            } else {
                showResponse('getAllResponse', result, true);
            }
        } catch (error) {
            showResponse('getAllResponse', `Ошибка: ${error.message}`, true);
        }

        hideLoading('getAllUsersBtn', originalText);
    });

    // Отобразить пользователей в виде карточек
    function displayUsersGrid(users) {
        const grid = document.getElementById('usersGrid');
        grid.innerHTML = '';

        if (Array.isArray(users) && users.length > 0) {
            users.forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                        <h4>👤 ${user.name || 'Без имени'}</h4>
                        <p><strong>ID:</strong> ${user.id}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        ${user.createdAt ? `<p><strong>Создан:</strong> ${new Date(user.createdAt).toLocaleString()}</p>` : ''}
                    `;
                grid.appendChild(card);
            });
        } else {
            grid.innerHTML = '<p style="text-align: center; color: #666;">Пользователи не найдены</p>';
        }
    }

    // Получить пользователя по ID
    document.getElementById('getUserByIdBtn').addEventListener('click', async () => {
        const id = document.getElementById('getUserId').value;
        if (!id) {
            alert('Введите ID пользователя');
            return;
        }

        const originalText = showLoading('getUserByIdBtn');

        try {
            const response = await fetch(`${getServerUrl()}/api/users/${id}`);
            const result = await response.json();

            if (response.ok) {
                showResponse('getUserByIdResponse', result);
            } else {
                showResponse('getUserByIdResponse', result, true);
            }
        } catch (error) {
            showResponse('getUserByIdResponse', `Ошибка: ${error.message}`, true);
        }

        hideLoading('getUserByIdBtn', originalText);
    });

    // Получить пользователя по Email
    document.getElementById('getUserByEmailBtn').addEventListener('click', async () => {
        const email = document.getElementById('getUserEmail').value;
        if (!email) {
            alert('Введите email пользователя');
            return;
        }

        const originalText = showLoading('getUserByEmailBtn');

        try {
            const response = await fetch(`${getServerUrl()}/api/users/email/${encodeURIComponent(email)}`);
            const result = await response.json();

            if (response.ok) {
                showResponse('getUserByEmailResponse', result);
            } else {
                showResponse('getUserByEmailResponse', result, true);
            }
        } catch (error) {
            showResponse('getUserByEmailResponse', `Ошибка: ${error.message}`, true);
        }

        hideLoading('getUserByEmailBtn', originalText);
    });

    // Обновить пользователя
    document.getElementById('updateUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('updateId').value;
        const name = document.getElementById('updateName').value;
        const email = document.getElementById('updateEmail').value;

        if (!id) {
            alert('Введите ID пользователя');
            return;
        }

        if (!name && !email) {
            alert('Введите хотя бы одно поле для обновления');
            return;
        }

        const originalText = showLoading('updateUserForm');

        const data = {};
        if (name) data.name = name;
        if (email) data.email = email;

        try {
            const response = await fetch(`${getServerUrl()}/api/users/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                showResponse('updateResponse', result);
                document.getElementById('updateUserForm').reset();
            } else {
                showResponse('updateResponse', result, true);
            }
        } catch (error) {
            showResponse('updateResponse', `Ошибка: ${error.message}`, true);
        }

        hideLoading('updateUserForm', originalText);
    });

    // Удалить пользователя
    document.getElementById('deleteUserBtn').addEventListener('click', async () => {
        const id = document.getElementById('deleteId').value;
        if (!id) {
            alert('Введите ID пользователя');
            return;
        }

        if (!confirm(`Вы уверены, что хотите удалить пользователя с ID ${id}?`)) {
            return;
        }

        const originalText = showLoading('deleteUserBtn');

        try {
            const response = await fetch(`${getServerUrl()}/api/users/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showResponse('deleteResponse', `Пользователь с ID ${id} успешно удален`);
                document.getElementById('deleteId').value = '';
            } else {
                const result = await response.json();
                showResponse('deleteResponse', result, true);
            }
        } catch (error) {
            showResponse('deleteResponse', `Ошибка: ${error.message}`, true);
        }

        hideLoading('deleteUserBtn', originalText);
    });
</script>
</body>
</html>
